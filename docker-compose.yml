version: '3.8'

services:
  api:
    build: .
    container_name: posts-api
    ports:
      - "3000:3000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=mongodb://mongo:27017/postsdb

  mongo:
    image: mongo:7
    container_name: posts-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: